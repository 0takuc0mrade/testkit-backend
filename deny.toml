# Supply-chain policy enforced by `cargo deny check` (see .github/workflows/ci.yml's
# `deny` job). Run `cargo deny check` locally before relying on a new dependency.

[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# paste is a transitive SDK dependency; RUSTSEC-2024-0436 only marks it unmaintained.
# Revisit this narrow exception when the SDK dependency tree removes paste.
ignore = ["RUSTSEC-2024-0436"]

[licenses]
version = 2
# Allowed licenses for this project and its dependency graph. Add to this
# list deliberately, not to silence a failing check — a license outside
# this set needs a documented reason (add it to `exceptions` below instead
# of widening `allow`).
allow = [
    "Apache-2.0",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.8
# The older wasmparser dependencies shipped by the Soroban SDK use the LLVM
# exception; allow that specific SPDX expression only for these crate versions.
exceptions = [
    { name = "wasmparser", version = "=0.116.1", allow = ["Apache-2.0 WITH LLVM-exception"] },
    { name = "wasmparser-nostd", version = "=0.100.2", allow = ["Apache-2.0 WITH LLVM-exception"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
