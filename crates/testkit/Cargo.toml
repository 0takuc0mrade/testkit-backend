[package]
name = "soroban-testkit"
description = "Testing infrastructure for Soroban contracts: money-math generators, event assertions, ledger time and TTL control, token test doubles."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = true

[dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
thiserror.workspace = true

[dev-dependencies]
vault = { path = "../../examples/vault", version = "0.1.0", features = ["testutils"] }
trybuild.workspace = true
